<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авторизація — Цікаві факти 💡</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fff;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  .code-box {
    background: #f4f4f4;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 1.25rem;
    font-family: "Courier New", monospace;
    font-size: 0.95rem;
    word-break: break-all;
    margin-bottom: 1.5rem;
    user-select: all;
  }
  button {
    background: #000;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
  }
  .hint { color: #666; font-size: 0.9rem; margin-top: 1rem; }
  .error { color: #c0392b; }
</style>
</head>
<body>

<h1>Код авторизації TikTok</h1>

<div id="result"></div>

<p class="hint">Скопіюй цей код і встав у термінал, де запущено скрипт
авторизації.</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  const errorDescription = params.get("error_description");
  const resultEl = document.getElementById("result");

  if (code) {
    const box = document.createElement("div");
    box.className = "code-box";
    box.textContent = code;
    resultEl.appendChild(box);

    const button = document.createElement("button");
    button.textContent = "Копіювати код";
    button.onclick = () => {
      navigator.clipboard.writeText(code);
      button.textContent = "Скопійовано!";
    };
    resultEl.appendChild(button);
  } else if (error) {
    const box = document.createElement("div");
    box.className = "code-box error";
    box.textContent = `Помилка: ${error}${errorDescription ? " — " + errorDescription : ""}`;
    resultEl.appendChild(box);
  } else {
    const box = document.createElement("div");
    box.className = "code-box";
    box.textContent = "Код не знайдено в URL. Перевір, чи ти потрапив сюди через процес авторизації TikTok.";
    resultEl.appendChild(box);
  }
</script>

</body>
</html>
